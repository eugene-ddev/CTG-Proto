# Push в main → проверка → выкладка на сервер. Выкладка общая с CTG-Proto-Backend: deploy/pull.sh на сервере
# подтягивает main обоих репозиториев и пересобирает клиент и сервер. Настройки сервера (домен, консоль) задаются
# в CTG-Proto-Backend; здесь — только доступ: секреты SSH_HOST, SSH_PRIVATE_KEY (+ SSH_USER, SSH_PORT)
# в окружении production (завести — CTG-Proto-Backend/deploy/github-env.sh). Без них выкладка пропускается.
# Правила игры (src/core, src/data) поменялись — сначала push сюда, потом sync-core и push в CTG-Proto-Backend:
# до этого выкладка остановится на проверке совпадения логики.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Окружение не настроено
        if: env.SSH_HOST == ''
        run: echo "::notice::Нет секрета SSH_HOST в окружении production — выкладка пропущена"

      - name: Выкладка
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            -p "${SSH_PORT:-22}" "${SSH_USER:-root}@$SSH_HOST" deploy < /dev/null
          rm -f ~/.ssh/deploy_key
