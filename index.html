<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- телефон: без масштабирования жестами, на весь экран под вырезом (поля — через safe-area ниже) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1e21" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CTG" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Cuber The Game — прототип</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #1d1e21; overflow: hidden;
        /* жесты браузера (зум, прокрутка, «назад» свайпом по канвасу) не мешают игре */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* поля под вырез и полоску «домой»; Phaser вписывает игру в #app */
      #wrap {
        position: fixed; inset: 0; box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #app { width: 100%; height: 100%; }
      canvas { display: block; }
      input, textarea { -webkit-user-select: text; user-select: text; }
      /* игра только горизонтальная: на телефоне в портрете — просьба повернуть */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10000; background: #1d1e21; color: #e6e2d8;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font: 600 18px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;
      }
      #rotate svg { width: 72px; height: 72px; animation: ctg-turn 2.4s ease-in-out infinite; }
      @keyframes ctg-turn { 0%, 25% { transform: rotate(0deg); } 50%, 75% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="app"></div></div>
    <div id="rotate">
      <svg viewBox="0 0 64 64" fill="none" stroke="#f2b312" stroke-width="3" stroke-linejoin="round"><rect x="20" y="6" width="24" height="52" rx="4" /><line x1="28" y1="51" x2="36" y2="51" /></svg>
      <div>Поверни телефон горизонтально</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
